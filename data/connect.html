<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ESP32 Wi-Fi Setup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
    }
    form {
      background: #fff;
      padding: 20px;
      margin: auto;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="radio"] {
      margin: 10px 0;
    }
    input[type="password"],
    input[type="submit"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    input[type="submit"] {
      background: #007BFF;
      color: white;
      border: none;
      cursor: pointer;
    }
    input[type="submit"]:hover {
      background: #0056b3;
    }
    .countdown {
      margin-top: 20px;
      font-size: 0.9em;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Configure Your ESP32</h1>
  <form method="POST" action="/connect">

    <div id="networks">{{NETWORKS}}</div>
    
    <input type="password" name="password" placeholder="Wi-Fi Password" required>
    <input type="submit" value="Connect">
  </form>
  <div class="countdown">
    This setup portal will close in <span id="timer">300</span> seconds.
  </div>

<span id="timer">300</span>

  <script>
    // Countdown timer
    let seconds = 300;
    const timerEl = document.getElementById("timer");
    setInterval(() => {
      seconds--;
      timerEl.textContent = seconds;
      if (seconds <= 0) {
        document.querySelector(".countdown").textContent = "Portal closed. Please reconnect.";
      }
    }, 1000);
  </script>
</body>
</html>
