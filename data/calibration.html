<!DOCTYPE html>
<html lang="en-US">

<head>
    <link rel="stylesheet" href="stylesheet.css">
    <title>IOB Speed Calibration</title>
    <meta charset="UTF-8">
    <meta name="author" content="George Hofmann">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div class="sidebar">
        <a href="index.html">Home</a>
        <a href="network.html">Network</a>
        <a href="locoparms.html">Locomotive</a>
        <a href="functions.html">Functions</a>

    <div class="content">


        <h2>Locomotive Speed Calibration</h2>

        <p>These values are normally set by using the calibration routine from a throttle (timing through a trap).
            However the default values or those obtained using the speed trap can be modified here.
        </p>

        <form action="/get">
            <input type="hidden" name="calibrationParm" value="0">
            <table>
                <tr>
                    <th></th>
                    <th>Forward</th>
                    <th>Reverse</th>
                </tr>
                <tr>
                    <td><label for="speed2forward">2 mph</label></td>
                    <td><input type="number step=0.001" id="speed2forward" name="speed2forward" value="%SPEED2FORWARD%" ></td>
                    <td><input type="number step=0.001" id="speed2reverse" name="speed2reverse" value="%SPEED2REVERSE%" ><br></td>
                </tr>
                <tr>
                    <td><label for="speed5forward">5 mph</label></td>
                    <td><input type="number step=0.001" id="speed5forward" name="speed5forward" value="%SPEED5FORWARD%" ></td>
                    <td><input type="number step=0.001" id="speed5reverse" name="speed5reverse" value="%SPEED5REVERSE%" ><br></td>
                </tr>
                <tr>
                    <td><label for="speed10forward">10 mph</label></td>
                    <td><input type="number step=0.001" id="speed10forward" name="speed10forward" value="%SPEED10FORWARD%" ></td>
                    <td><input type="number step=0.001" id="speed10reverse" name="speed10reverse" value="%SPEED10REVERSE%" ><br></td>
                </tr>
                <tr>
                    <td><label for="speed20forward">20 mph</label></td>
                    <td><input type="number step=0.001" id="speed20forward" name="speed20forward" value="%SPEED20FORWARD%" ></td>
                    <td><input type="number step=0.001" id="speed20reverse" name="speed20reverse" value="%SPEED20REVERSE%" ><br></td>
                </tr>
                <tr>
                    <td><label for="speed50forward">50 mph</label></td>
                    <td><input type="number step=0.001" id="speed50forward" name="speed50forward" value="%SPEED50FORWARD%" ></td>
                    <td><input type="number step=0.001" id="speed50reverse" name="speed50reverse" value="%SPEED50REVERSE%" ><br></td>
                </tr>
      
            </table>
            <br><br>
            <input type="submit">   <input type="reset">
        </form>

    </div>

</body>

</html>
