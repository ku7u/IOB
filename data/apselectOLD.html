<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" href="stylesheet.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">
    <title>Select WiFi Network</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 1em;
            background-color: #f5f5f5;
        }

        .networks {
            margin-bottom: 1em;
        }

        .network {
            background: white;
            border: 1px solid #ccc;
            padding: 0.75em;
            margin-bottom: 0.5em;
            border-radius: 6px;
        }

        .network input[type="radio"] {
            margin-right: 0.5em;
        }

        label {
            display: inline-block;
            cursor: pointer;
        }

        .password {
            margin-bottom: 1em;
        }

        button {
            padding: 0.6em 1.2em;
            font-size: 1em;
            border: none;
            background-color: #0066cc;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005bb5;
        }
    </style>
</head>

<body>
    <h2>Connect to WiFi</h2>
        <p>
      If no results are shown, reload the page. Several reloads may be required</p>
    <form method="POST" action="/save">
        <div class="networks" id="networkList">
            <!-- Filled by JS -->
        </div>

        <div class="password">
            <label for="password">Password:</label><br>
            <input type="password" name="password" id="password" required>
        </div>

        <button type="submit">Connect</button>
    </form>

    <script>
        fetch("/scan")
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById("networkList");
                data.forEach((net, idx) => {
                    const div = document.createElement("div");
                    div.className = "network";
                    div.innerHTML = `
            <label>
              <input type="radio" name="ssid" value="${net.ssid}" ${idx === 0 ? "checked" : ""}>
              ${net.ssid} (${net.rssi} dBm)
            </label>
          `;
                    list.appendChild(div);
                });
            });
    </script>
</body>

</html>
