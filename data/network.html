  <div class="content">
    <h2>Network Parameters</h2>

    <p>Assign the following network parameters associated with this loco. The topics must match those in the controlling device, such as JMRI.</p>

    <form action="/get">
      <input type="hidden" name="NetworkParm" value="0">
      <table>
        <tr>
          <th>Item</th>
          <th>Value</th>
        </tr>

        <tr>
          <td>MQTT Server IP</td>
          <td><input type="text" name="mqttserver" value="%MQTTSERVERIPADR%"></td>
        </tr>

        <tr>
          <td>Topic Command Left End</td>
          <td><input type="text" name="commandtopic" value="%TOPICCOMMANDLEFTEND%"></td>
        </tr>

        <tr>
          <td>Topic Feedback Left End</td>
          <td><input type="text" name="feedbacktopic" value="%TOPICFEEDBACKLEFTEND%"></td>
        </tr>
      </table>
      <br>
      <input type="submit" value="Submit">   <input type="reset">
        </form>
  </div>

</body>

</html>
