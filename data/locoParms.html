<!DOCTYPE html>
<html lang="en-US">

<head>
    <link rel="stylesheet" href="stylesheet.css">
    <title>IOB Loco Parameters</title>
    <meta charset="UTF-8">
    <meta name="author" content="George Hofmann">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div class="sidebar">
        <a href="index.html">Home</a>
        <a href="network.html">Network</a>
        <a class="active" href="locoparms.html">Locomotive</a>
        <a href="functions.html">Functions</a>
        <a href="update/index.html">Update</a>
    </div>

    <div class="content">
        <h2>Assign Locomotive Parameters</h2>


        <p>Assign all parameters associated with this locomotive.
            If unknown, retain the default.</p>

        <form action="/get">
            <input type="hidden" name="locoparmsParm" value="0">
            <table>

                <tr>
                    <td><label for="address">Address</label></td>
                    <td><input type="number" id="address" name="address" value="%ADDRESS%" min="1" max="9999"><br></td>
                </tr>
                <tr>
                    <td><label for="horsepower">Horsepower</label></td>
                    <td><input type="number" id="horsepower" name="horsepower" value="%HORSEPOWER%" min="100" max="7000"><br></td>
                </tr>
                <tr>
                    <td><label for="weight">Weight (lbs)</label></td>
                    <td><input type="number" id="weight" name="weight" value="%WEIGHT%" min="50000" max="1000000"></td>
                </tr>
            </table>
            <br><br>
            <input type="submit">   <input type="reset">
        </form>
    </div>

</body>

</html>
